<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students Registrations Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased">

    <div class="max-w-7xl mx-auto p-6">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-indigo-600">All Students Registrations Dashboard</h1>
            <p class="text-gray-500 mt-2">Streaming live from Google Sheets. Changes sync automatically on refresh.</p>
            
            <div id="loadingStatus" class="mt-4 inline-flex items-center px-4 py-2 font-semibold leading-6 text-sm shadow rounded-md text-indigo-600 bg-white border border-indigo-100">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Connecting to Google Sheet & processing data...
            </div>
        </header>

        <div id="filterContainer" class="hidden bg-white p-6 rounded-xl shadow border border-gray-200 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">Cascading Filters</h2>
                <button id="resetFilters" class="px-4 py-1.5 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium rounded-md transition cursor-pointer">Clear All Filters</button>
            </div>
            <div id="filtersGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                </div>
        </div>

        <div id="tableContainer" class="hidden bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
            <div class="p-4 bg-gray-100 border-b border-gray-200 flex justify-between items-center">
                <span id="recordCount" class="text-sm font-medium text-gray-600">Showing 0 rows</span>
            </div>
            <div class="overflow-x-auto max-h-[600px]">
                <table class="w-full text-left border-collapse">
                    <thead id="tableHeader" class="bg-gray-50 sticky top-0 border-b border-gray-200 shadow-sm z-10">
                        </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-200 text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Your live Google Sheets CSV link
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSwSxs2JtEUGewXFCvir7vQJMjsIdS-ODqzBeAQTi_4Wmp73pDTPh27f7qTedZpu_CTmMiBLMLf5lzm/pub?gid=837128863&single=true&output=csv";

        let rawData = [];      
        let originalColumns = []; // Raw columns containing hidden \n or spacing
        let activeFilters = {}; 

        document.getElementById('resetFilters').addEventListener('click', resetAllFilters);

        // Fetch Google Sheet data automatically on page load
        async function fetchLiveSheetData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                // Read as arrayBuffer to perfectly handle multi-line string payloads
                const buffer = await response.arrayBuffer();
                const data = new Uint8Array(buffer);
                
                // Parse workbook
                const workbook = XLSX.read(data, { type: 'array', codepage: 65001 });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                rawData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                if (rawData.length > 0) {
                    originalColumns = Object.keys(rawData[0]);
                    
                    // Reveal the panels
                    document.getElementById('loadingStatus').classList.add('hidden');
                    document.getElementById('filterContainer').classList.remove('hidden');
                    document.getElementById('tableContainer').classList.remove('hidden');
                    
                    buildFilters();
                    updateDashboard();
                } else {
                    document.getElementById('loadingStatus').innerHTML = `<span class="text-amber-600 font-semibold">The spreadsheet was read successfully but contains no data inside it.</span>`;
                }
            } catch (error) {
                console.error("Failed to fetch data:", error);
                document.getElementById('loadingStatus').innerHTML = `<span class="text-red-500 font-semibold">Error loading Google Sheet. Please double-check internet access or link permissions.</span>`;
            }
        }

        // Clean up visual header presentation (Removes raw newlines like 'Applied\n Company')
        function cleanHeaderName(header) {
            return header.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
        }

        // Build dynamic filter dropdowns based on your live sheet headers
        function buildFilters() {
            const grid = document.getElementById('filtersGrid');
            grid.innerHTML = ''; 

            originalColumns.forEach(col => {
                // Ignore the serial number column from acting as a filter block
                if (cleanHeaderName(col).toLowerCase() === 's.no') return;

                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col';
                const cleanLabel = cleanHeaderName(col);
                
                wrapper.innerHTML = `
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 truncate" title="${cleanLabel}">${cleanLabel}</label>
                    <select data-column="${col}" class="filter-select w-full p-2 border border-gray-300 rounded-md bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition cursor-pointer">
                        <option value="">All</option>
                    </select>
                `;
                grid.appendChild(wrapper);
            });

            // Listen for changes across generated inputs
            document.querySelectorAll('.filter-select').forEach(select => {
                select.addEventListener('change', function() {
                    const col = this.getAttribute('data-column');
                    if (this.value === "") {
                        delete activeFilters[col];
                    } else {
                        activeFilters[col] = this.value;
                    }
                    updateDashboard();
                });
            });
        }

        // Handle cascading logic: if Filter A changes, adjust available values in filter B, C, D...
        function updateDashboard() {
            // Apply filtering criteria over the records
            const filteredData = rawData.filter(row => {
                for (let col in activeFilters) {
                    if (String(row[col]).trim() !== activeFilters[col]) {
                        return false;
                    }
                }
                return true;
            });

            // Recompute available drop-down selections based on the constraints of companion inputs
            document.querySelectorAll('.filter-select').forEach(select => {
                const col = select.getAttribute('data-column');
                const currentValue = select.value;

                const dataFilteredByOthers = rawData.filter(row => {
                    for (let otherCol in activeFilters) {
                        if (otherCol === col) continue; 
                        if (String(row[otherCol]).trim() !== activeFilters[otherCol]) {
                            return false;
                        }
                    }
                    return true;
                });

                // Generate unique array options
                const uniqueValues = [...new Set(dataFilteredByOthers.map(row => String(row[col]).trim()))]
                                      .filter(val => val !== "")
                                      .sort();

                select.innerHTML = '<option value="">All</option>';
                uniqueValues.forEach(val => {
                    const option = document.createElement('option');
                    option.value = val;
                    option.textContent = val;
                    if (val === currentValue) option.selected = true;
                    select.appendChild(option);
                });
            });

            renderTable(filteredData);
        }

        // Render clean structural table rows
        function renderTable(data) {
            const headerRow = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');
            document.getElementById('recordCount').textContent = `Showing ${data.length} of ${rawData.length} entries`;

            // Draw clean table headers
            headerRow.innerHTML = '<tr>' + originalColumns.map(col => `
                <th class="px-6 py-3 text-xs font-semibold uppercase tracking-wider text-gray-500 bg-gray-50 whitespace-nowrap">${cleanHeaderName(col)}</th>
            `).join('') + '</tr>';

            // Draw data empty rows fallback
            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="${originalColumns.length}" class="px-6 py-10 text-center text-gray-400">No matching student data matches these filters.</td></tr>`;
                return;
            }

            // Draw student listing entries
            tableBody.innerHTML = data.map(row => {
                return `<tr class="hover:bg-gray-50/70 transition">` + originalColumns.map(col => `
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600 border-b border-gray-100">${row[col] ?? ""}</td>
                `).join('') + `</tr>`;
            }).join('');
        }

        function resetAllFilters() {
            activeFilters = {};
            document.querySelectorAll('.filter-select').forEach(select => select.value = "");
            updateDashboard();
        }

        // Trigger process engine
        fetchLiveSheetData();
    </script>
</body>
</html>
