<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    width:100%;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.search-box{
    margin-bottom:15px;
}

.search-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

.info{
    margin-bottom:15px;
    font-weight:bold;
}

.table-container{
    background:white;
    border-radius:8px;
    overflow:auto;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    max-height:80vh;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead th{
    position:sticky;
    top:0;
    background:#0d6efd;

    z-index:100;
}

th,td{
    border:1px solid #ddd;

}

tr:nth-child(even){
    background:#f8f9fa;
}

    background:#e9ecef;
}

    text-align:center;
    padding:20px;
    color:#666;
}

</style>
</head>

<body>

<div class="container">

<h1>Student Registration Dashboard</h1>

<div class="search-box">
<input type="text" id="searchInput"
placeholder="Search Student, Roll Number, Company, Branch...">
</div>

<div class="info">
Total Records :
<span id="recordCount">0</span>
</div>

<div class="table-container">

<table id="studentTable">

<thead></thead>

<tbody>
<tr>
<td class="loading">Loading data...</td>
</tr>
</tbody>

</table>

</div>

</div>

<script>

/* ==========================
   GOOGLE SHEET SETTINGS
========================== */

const CSV_URL ="https://docs.google.com/spreadsheets/d/e/2PACX-1vSwSxs2JtEUGewXFCvir7vQJMjsIdS-ODqzBeAQTi_4Wmp73pDTPh27f7qTedZpu_CTmMiBLMLf5lzm/pub?gid=837128863&single=true&output=csv";


/* ==========================
   GLOBAL DATA
========================== */

let sheetData = [];

/* ==========================
   CLEAN TEXT
========================== */

function cleanText(value){

    return String(value || "")
        .replace(/[\r\n\t]+/g," ")
        .replace(/\s+/g," ")
        .trim();
}

/* ==========================
   CSV PARSER
========================== */

function parseCSV(text){

    const rows = [];
    const lines = text.split(/\r?\n/);

    for(let line of lines){

        let row = [];
        let current = "";
        let insideQuotes = false;

        for(let i=0;i<line.length;i++){

            const char = line[i];

            if(char === '"'){

                insideQuotes = !insideQuotes;
            }
            else if(char === "," && !insideQuotes){

                row.push(cleanText(current));
                current = "";
            }
            else{

                current += char;
            }
        }

        row.push(cleanText(current));

        if(row.some(cell => cell !== "")){
            rows.push(row);
        }
    }

    return rows;
}

/* ==========================
   LOAD DATA
========================== */

async function loadData(){

    try{

        const response = await fetch(CSV_URL);

        const csvText = await response.text();

        if(
            csvText.startsWith("<!DOCTYPE") ||
            csvText.startsWith("<html")
        ){

            document.querySelector("#studentTable tbody")
            .innerHTML =
            `<tr>
                <td>
                Sheet is not public or URL is incorrect.
                </td>
            </tr>`;

            return;
        }

        const rows = parseCSV(csvText);

        if(rows.length < 2){
            return;
        }

        const headers =
            rows[0].map(h => cleanText(h));

        sheetData = rows.slice(1).map(row => {

            let obj = {};

            headers.forEach((header,index)=>{

                obj[header] =
                    cleanText(row[index] || "");
            });

            return obj;
        });

        document.getElementById("recordCount")
        .innerText = sheetData.length;

        renderTable(sheetData);

    }
    catch(error){

        console.error(error);

        document.querySelector("#studentTable tbody")
        .innerHTML =
        `<tr>
            <td>Error loading data</td>
        </tr>`;
    }
}

/* ==========================
   RENDER TABLE
========================== */

function renderTable(data){

    const thead =
        document.querySelector("#studentTable thead");

    const tbody =
        document.querySelector("#studentTable tbody");

    thead.innerHTML = "";
    tbody.innerHTML = "";

    if(data.length === 0){

        tbody.innerHTML =
        `<tr>
            <td>No Data Found</td>
        </tr>`;

        return;
    }

    const headers = Object.keys(data[0]);

    let headerRow = "<tr>";

    headers.forEach(header => {

        headerRow +=
        `<th>${header}</th>`;
    });

    headerRow += "</tr>";

    thead.innerHTML = headerRow;

    const bodyRows = data.map(row => {

        let tr = "<tr>";

        headers.forEach(header => {

            tr +=
            `<td>${cleanText(row[header])}</td>`;
        });

        tr += "</tr>";

        return tr;

    }).join("");

    tbody.innerHTML = bodyRows;
}

/* ==========================
   SEARCH
========================== */

document.getElementById("searchInput")
.addEventListener("keyup", function(){

    const keyword =
        this.value.toLowerCase();

    const filtered =
        sheetData.filter(row =>

            Object.values(row)
            .join(" ")
            .toLowerCase()
            .includes(keyword)

        );

    renderTable(filtered);
});

/* ==========================
   INITIAL LOAD
========================== */

loadData();

/* AUTO REFRESH */

setInterval(loadData,30000);

</script>

</body>
</html>
