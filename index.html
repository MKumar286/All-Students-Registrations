<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Dashboard</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f4f6f9;
        padding:20px;
    }

    .container{
        max-width:100%;
        margin:auto;
    }

    h1{
        text-align:center;
        margin-bottom:20px;
        color:#333;
    }

    .search-box{
        margin-bottom:15px;
    }

    .search-box input{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:5px;
        font-size:16px;
    }

    .cards{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
        gap:15px;
        margin-bottom:20px;
    }

    .card{
        background:white;
        padding:20px;
        border-radius:10px;
        text-align:center;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    .card h2{
        color:#007bff;
    }

    .table-container{
        overflow:auto;
        background:white;
        border-radius:10px;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    table{
        width:100%;
        border-collapse:collapse;
        min-width:2000px;
    }

    th{
        background:#007bff;
        color:white;
        position:sticky;
        top:0;
        z-index:10;
    }

    th,td{
        border:1px solid #ddd;
        padding:8px;
        text-align:left;
        font-size:13px;
    }

    tr:nth-child(even){
        background:#f9f9f9;
    }

    .selected{
        background:#d4edda;
        color:#155724;
        font-weight:bold;
    }

    .rejected{
        background:#f8d7da;
        color:#721c24;
        font-weight:bold;
    }
</style>
</head>
<body>

<div class="container">

    <h1>Student Registration Dashboard</h1>

    <div class="cards">
        <div class="card">
            <h2 id="totalStudents">0</h2>
            <p>Total Records</p>
        </div>

        <div class="card">
            <h2 id="selectedStudents">0</h2>
            <p>Selected</p>
        </div>

        <div class="card">
            <h2 id="shortlistedStudents">0</h2>
            <p>Shortlisted</p>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search Student, Roll No, Company...">
    </div>

    <div class="table-container">
        <table id="studentTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script>

// Google Sheet CSV Export URL
const CSV_URL =
"https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID/export?format=csv&gid=0";

let sheetData = [];

async function loadData() {

    try {

        const response = await fetch(CSV_URL);
        const csvText = await response.text();

        const rows = csvText.split("\n").map(row =>
            row.split(",").map(cell =>
                cell.replace(/^"|"$/g, "").trim()
            )
        );

        const headers = rows[0];

        sheetData = rows.slice(1).map(row => {
            let obj = {};
            headers.forEach((header, index) => {
                obj[header] = row[index] || "";
            });
            return obj;
        });

        updateCards();
        renderTable(sheetData);

    } catch(error) {
        console.error("Error loading CSV:", error);
    }
}

function updateCards() {

    document.getElementById("totalStudents").innerText =
        sheetData.length;

    const selected = sheetData.filter(row =>
        (row["Final Status"] || "")
        .toLowerCase()
        .includes("selected")
    ).length;

    document.getElementById("selectedStudents").innerText =
        selected;

    const shortlisted = sheetData.filter(row =>
        (row["Shortlisted by Company"] || "")
        .toLowerCase()
        .includes("yes")
    ).length;

    document.getElementById("shortlistedStudents").innerText =
        shortlisted;
}

function renderTable(data) {

    const tableHead =
        document.querySelector("#studentTable thead");

    const tableBody =
        document.querySelector("#studentTable tbody");

    tableHead.innerHTML = "";
    tableBody.innerHTML = "";

    if (data.length === 0) return;

    const headers = Object.keys(data[0]);

    tableHead.innerHTML =
        "<tr>" +
        headers.map(h => `<th>${h}</th>`).join("") +
        "</tr>";

    tableBody.innerHTML = data.map(row => {

        let rowHTML = "<tr>";

        headers.forEach(header => {

            let value = row[header] || "";
            let cls = "";

            if (header === "Final Status") {

                if (value.toLowerCase().includes("selected"))
                    cls = "selected";

                if (value.toLowerCase().includes("rejected"))
                    cls = "rejected";
            }

            rowHTML += `<td class="${cls}">${value}</td>`;
        });

        rowHTML += "</tr>";

        return rowHTML;

    }).join("");
}

document.getElementById("searchInput")
.addEventListener("keyup", function() {

    const keyword = this.value.toLowerCase();

    const filtered = sheetData.filter(row =>
        Object.values(row)
            .join(" ")
            .toLowerCase()
            .includes(keyword)
    );

    renderTable(filtered);
});

loadData();

// Auto refresh every 60 seconds
setInterval(loadData, 60000);

</script>

</body>
</html>
