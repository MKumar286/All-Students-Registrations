<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
// Replace this URL string if your Google Sheet settings change!
const csvURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRiETxVy0sYxBeApgtsDzUGSTzlrH5IjVjYh83cqlq0XLsAeOK9w7KYRzBVc8V9ah4jEPRzdZkEq9i5/pub?gid=1926306429&single=true&output=csv";

let allData=[];
let currentFilteredData=[]; 

let branchKey = "", appliedCompanyKey = "", roleKey = "", tpoKey = "", companyShortlistKey = "";
let paperTest1Key = "", paperTest2Key = "", rollKey = "", gdKey = "", oa1Key = "", oa2Key = "", oa3Key = "";
let tech1Key = "", tech2Key = "", hrKey = "", managerialKey = "", finalStatusKey = "";

window.addEventListener('DOMContentLoaded', () => {
    setTimeout(initParsing, 300);
});

function initParsing() {
    if (typeof Papa === 'undefined') {
        document.getElementById("tableBodyContent").innerHTML = "<tr><td colspan='30' style='padding:20px; background:#fff; color:orange;'>Engine components initializing, refreshing layout...</td></tr>";
        setTimeout(initParsing, 600);
        return;
    }

    Papa.parse(csvURL,{
        download:true,
        header:true,
        skipEmptyLines:true,
        complete:function(results){
            allData = results.data.filter(row => Object.values(row).join("").trim() !== "");
            if(allData.length===0){
                document.getElementById("tableBodyContent").innerHTML = "<tr><td colspan='30' style='padding:25px; background:#fff; color:#d32f2f;'>⚠️ The Sheet parsed successfully but contains no data rows.</td></tr>";
                return;
            }

            let headers = Object.keys(allData[0]);

            // Smart-detecting column keys from your Google Sheet headers
            branchKey = headers.find(h => h.toLowerCase().trim().includes("branch")) || "";
            appliedCompanyKey = headers.find(h => h.toLowerCase().trim().includes("company name")) || headers.find(h => h.toLowerCase().trim().includes("company")) || "";
            roleKey = headers.find(h => h.toLowerCase().trim().includes("profile") || h.toLowerCase().trim().includes("role")) || "";
            tpoKey = headers.find(h => h.toLowerCase().trim().includes("tpo")) || "";
            companyShortlistKey = headers.find(h => h.toLowerCase().trim().includes("shortlist")) || "";
            rollKey = headers.find(h => h.toLowerCase().trim().includes("roll") || h.toLowerCase().trim().includes("htno")) || "";
            paperTest1Key = headers.find(h => h.toLowerCase().trim().includes("pen") && h.toLowerCase().trim().includes("1")) || "";
            paperTest2Key = headers.find(h => h.toLowerCase().trim().includes("pen") && h.toLowerCase().trim().includes("2")) || "";
            gdKey = headers.find(h => h.toLowerCase().trim().includes("gd") || h.toLowerCase().trim().includes("group discussion")) || "";
            oa1Key = headers.find(h => h.toLowerCase().trim().includes("oa") && h.toLowerCase().trim().includes("1")) || "";
            oa2Key = headers.find(h => h.toLowerCase().trim().includes("oa") && h.toLowerCase().trim().includes("2")) || "";
            oa3Key = headers.find(h => h.toLowerCase().trim().includes("oa") && h.toLowerCase().trim().includes("3")) || "";
            tech1Key = headers.find(h => h.toLowerCase().trim().includes("tech") && h.toLowerCase().trim().includes("1")) || "";
            tech2Key = headers.find(h => h.toLowerCase().trim().includes("tech") && h.toLowerCase().trim().includes("2")) || "";
            hrKey = headers.find(h => h.toLowerCase().trim().includes("hr")) || "";
            managerialKey = headers.find(h => h.toLowerCase().trim().includes("managerial")) || "";
            finalStatusKey = headers.find(h => h.toLowerCase().trim() === "status" || h.toLowerCase().trim().includes("final status")) || "";

            currentFilteredData = [...allData];
            buildTable(allData);
            populateFilters(allData);
            updateStats(allData);
            setupEventListeners();
        },
        error:function(err){
            console.error(err);
            document.getElementById("tableBodyContent").innerHTML = "<tr><td colspan='30' style='padding:25px; background:#fff; color:#c62828; font-weight:bold;'>❌ Connection Offline: Verify that your source Google Sheet is set to 'Publish to Web' as a CSV format.</td></tr>";
        }
    });
}

function buildTable(data){
    let thead=document.querySelector("#placementTable thead");
    let tbody=document.querySelector("#placementTable tbody");
    thead.innerHTML=""; tbody.innerHTML="";

    if(data.length===0){
        tbody.innerHTML="<tr><td colspan='30' style='padding:20px; background:#fff; color:#333; font-weight:bold;'>No Records Found Matching Your Selections</td></tr>";
        return;
    }

    let headers=Object.keys(data[0]);
    let tr=document.createElement("tr");
    headers.forEach(h=>{
        let th=document.createElement("th"); th.innerText=h; tr.appendChild(th);
    });
    thead.appendChild(tr);

    data.forEach(row=>{
        let tr=document.createElement("tr");
        headers.forEach(h=>{
            let td=document.createElement("td");
            let value = row[h] ? row[h].toString().trim() : "";
            if(value.includes("http")){
                let a=document.createElement("a"); a.href=value; a.target="_blank"; a.className="link-btn";
                if(h.toLowerCase().includes("intern")){ a.innerText="📄 Internship Letter"; }
                else if(h.toLowerCase().includes("offer")){ a.innerText="📄 Offer Letter"; }
                else { a.innerText="📄 View"; }
                td.appendChild(a);
            } else { td.innerText=value; }
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

function populateFilters(data){
    let getOpts = (key) => key ? [...new Set(data.map(d=>(d[key] || "").trim()).filter(Boolean))].sort() : [];

    let fillSel = (id, opts, def) => {
        let el = document.getElementById(id);
        if(!el) return;
        el.innerHTML = `<option value="">${def}</option>`;
        opts.forEach(v => el.add(new Option(v,v)));
    };

    fillSel("branchFilter", getOpts(branchKey), "All Branches");
    fillSel("appliedCompanyFilter", getOpts(appliedCompanyKey), "Applied Company");
    fillSel("roleFilter", getOpts(roleKey), "Role Applied");
    fillSel("tpoFilter", getOpts(tpoKey), "Shortlisted by TPO");
    fillSel("companyShortlistFilter", getOpts(companyShortlistKey), "Shortlisted by Company");
    fillSel("paperTest1Filter", getOpts(paperTest1Key), "Pen & Paper Test 1 Status");
    fillSel("paperTest2Filter", getOpts(paperTest2Key), "Pen & Paper Test 2 Status");
    fillSel("gdFilter", getOpts(gdKey), "GD Cleared?");
    fillSel("oa1Filter", getOpts(oa1Key), "OA-1 Cleared?");
    fillSel("oa2Filter", getOpts(oa2Key), "OA-2 Cleared?");
    fillSel("oa3Filter", getOpts(oa3Key), "OA-3 Cleared?");
    fillSel("tech1Filter", getOpts(tech1Key), "Tech Round-1 Cleared?");
    fillSel("tech2Filter", getOpts(tech2Key), "Tech Round-2 Cleared?");
    fillSel("hrFilter", getOpts(hrKey), "HR Interview Cleared?");
    fillSel("managerialFilter", getOpts(managerialKey), "Managerial Round Cleared?");
    fillSel("finalStatusFilter", getOpts(finalStatusKey), "Final Status of Student");
}

// Applies search logic dynamically across inputs and dropdown selectors
function applyFilters() {
    let searchVal = document.getElementById("search").value.toLowerCase().trim();
    
    let branchVal = document.getElementById("branchFilter").value;
    let compVal = document.getElementById("appliedCompanyFilter").value;
    let roleVal = document.getElementById("roleFilter").value;
    let tpoVal = document.getElementById("tpoFilter").value;
    let compShortVal = document.getElementById("companyShortlistFilter").value;
    let paper1Val = document.getElementById("paperTest1Filter").value;
    let paper2Val = document.getElementById("paperTest2Filter").value;
    let gdVal = document.getElementById("gdFilter").value;
    let oa1Val = document.getElementById("oa1Filter").value;
    let oa2Val = document.getElementById("oa2Filter").value;
    let oa3Val = document.getElementById("oa3Filter").value;
    let tech1Val = document.getElementById("tech1Filter").value;
    let tech2Val = document.getElementById("tech2Filter").value;
    let hrVal = document.getElementById("hrFilter").value;
    let managerialVal = document.getElementById("managerialFilter").value;
    let statusVal = document.getElementById("finalStatusFilter").value;

    currentFilteredData = allData.filter(row => {
        // Text Search evaluation
        if (searchVal) {
            let matchesSearch = Object.values(row).some(val => String(val).toLowerCase().includes(searchVal));
            if (!matchesSearch) return false;
        }

        // Match evaluations for all drop-down criteria
        if (branchVal && (row[branchKey] || "").trim() !== branchVal) return false;
        if (compVal && (row[appliedCompanyKey] || "").trim() !== compVal) return false;
        if (roleVal && (row[roleKey] || "").trim() !== roleVal) return false;
        if (tpoVal && (row[tpoKey] || "").trim() !== tpoVal) return false;
        if (compShortVal && (row[companyShortlistKey] || "").trim() !== compShortVal) return false;
        if (paper1Val && (row[paperTest1Key] || "").trim() !== paper1Val) return false;
        if (paper2Val && (row[paperTest2Key] || "").trim() !== paper2Val) return false;
        if (gdVal && (row[gdKey] || "").trim() !== gdVal) return false;
        if (oa1Val && (row[oa1Key] || "").trim() !== oa1Val) return false;
        if (oa2Val && (row[oa2Key] || "").trim() !== oa2Val) return false;
        if (oa3Val && (row[oa3Key] || "").trim() !== oa3Val) return false;
        if (tech1Val && (row[tech1Key] || "").trim() !== tech1Val) return false;
        if (tech2Val && (row[tech2Key] || "").trim() !== tech2Val) return false;
        if (hrVal && (row[hrKey] || "").trim() !== hrVal) return false;
        if (managerialVal && (row[managerialKey] || "").trim() !== managerialVal) return false;
        if (statusVal && (row[finalStatusKey] || "").trim() !== statusVal) return false;

        return true;
    });

    buildTable(currentFilteredData);
    updateStats(currentFilteredData);
}

function setupEventListeners() {
    const filterIds = [
        "search", "branchFilter", "appliedCompanyFilter", "roleFilter", "tpoFilter", 
        "companyShortlistFilter", "paperTest1Filter", "paperTest2Filter", "gdFilter", 
        "oa1Filter", "oa2Filter", "oa3Filter", "tech1Filter", "tech2Filter", 
        "hrFilter", "managerialFilter", "finalStatusFilter"
    ];
    
    filterIds.forEach(id => {
        let el = document.getElementById(id);
        if (el) {
            el.addEventListener(id === "search" ? "input" : "change", applyFilters);
        }
    });
}

// Dynamic Counter Panel calculations
function updateStats(data) {
    let checkPass = (val) => {
        if(!val) return false;
        let txt = val.toLowerCase().trim();
        return txt === "yes" || txt === "cleared" || txt === "pass" || txt === "shortlisted" || txt === "selected";
    };

    let totalRegs = data.length;
    let uniqueCompanies = new Set(data.map(d => (d[appliedCompanyKey] || "").trim()).filter(Boolean)).size;

    let countTpo = data.filter(d => checkPass(d[tpoKey])).length;
    let countCompShort = data.filter(d => checkPass(d[companyShortlistKey])).length;
    let countPaper1 = data.filter(d => checkPass(d[paperTest1Key])).length;
    let countPaper2 = data.filter(d => checkPass(d[paperTest2Key])).length;
    let countGd = data.filter(d => checkPass(d[gdKey])).length;
    let countOa1 = data.filter(d => checkPass(d[oa1Key])).length;
    let countOa2 = data.filter(d => checkPass(d[oa2Key])).length;
    let countOa3 = data.filter(d => checkPass(d[oa3Key])).length;
    let countTech1 = data.filter(d => checkPass(d[tech1Key])).length;
    let countTech2 = data.filter(d => checkPass(d[tech2Key])).length;
    let countHr = data.filter(d => checkPass(d[hrKey])).length;
    let countManagerial = data.filter(d => checkPass(d[managerialKey])).length;
    
    let countSelected = data.filter(d => {
        let val = (d[finalStatusKey] || "").toLowerCase().trim();
        return val === "selected" || val === "placed" || val === "hired";
    }).length;

    // Direct mapping to DOM node updates
    document.getElementById("statRegistrations").innerText = totalRegs;
    document.getElementById("statCompanies").innerText = uniqueCompanies;
    document.getElementById("statTpo").innerText = countTpo;
    document.getElementById("statCompanyShort").innerText = countCompShort;
    document.getElementById("statPaper1").innerText = countPaper1;
    document.getElementById("statPaper2").innerText = countPaper2;
    document.getElementById("statGd").innerText = countGd;
    document.getElementById("statOa1").innerText = countOa1;
    document.getElementById("statOa2").innerText = countOa2;
    document.getElementById("statOa3").innerText = countOa3;
    document.getElementById("statTech1").innerText = countTech1;
    document.getElementById("statTech2").innerText = countTech2;
    document.getElementById("statHr").innerText = countHr;
    document.getElementById("statManagerial").innerText = countManagerial;
    document.getElementById("statSelected").innerText = countSelected;
}

// SheetJS implementation for parsing arrays out into actual spreadsheet items
function downloadExcel() {
    if (currentFilteredData.length === 0) {
        alert("No current data available to download.");
        return;
    }
    if (typeof XLSX === 'undefined') {
        alert("Excel utility library is currently loading. Give it a moment!");
        return;
    }

    let worksheet = XLSX.utils.json_to_sheet(currentFilteredData);
    let workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Placement Data");
    
    // Outputs the file smoothly down to the user's browser storage
    XLSX.writeFile(workbook, "MGIT_Placement_Journey_Data.xlsx");
}
</script>

</body>
</html>
