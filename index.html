<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Data Dashboard</title>
    <!-- Tailwind CSS for modern UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SheetJS for parsing CSV data -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased">

    <div class="max-w-7xl mx-auto p-6">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-indigo-600">All Students Registrations Dashboard</h1>
            <p class="text-gray-500 mt-2">Streaming live from Google Sheets. Changes sync automatically.</p>
            <!-- Loading Indicator -->
            <div id="loadingStatus" class="mt-4 inline-flex items-center px-4 py-2 font-semibold leading-6 text-sm shadow rounded-md text-indigo-600 bg-white border border-indigo-100">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Fetching live data...
            </div>
        </header>

        <!-- Filters Section (Generated Dynamically) -->
        <div id="filterContainer" class="hidden bg-white p-6 rounded-xl shadow border border-gray-200 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">Cascading Filters</h2>
                <button id="resetFilters" class="px-4 py-1.5 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium rounded-md transition">Clear All Filters</button>
            </div>
            <div id="filtersGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Dropdowns dynamically injected here -->
            </div>
        </div>

        <!-- Data Table Section -->
        <div id="tableContainer" class="hidden bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
            <div class="p-4 bg-gray-100 border-b border-gray-200 flex justify-between items-center">
                <span id="recordCount" class="text-sm font-medium text-gray-600">Showing 0 rows</span>
            </div>
            <div class="overflow-x-auto max-h-[600px]">
                <table class="w-full text-left border-collapse">
                    <thead id="tableHeader" class="bg-gray-50 sticky top-0 border-b border-gray-200 shadow-sm z-10">
                        <!-- Headers injected here -->
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-200 text-sm">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Paste your published Google Sheets CSV link here
        const SHEET_CSV_URL = "YOUR_GOOGLE_SHEET_CSV_URL_HERE";

        let rawData = [];      
        let columns = [];      
        let activeFilters = {}; 

        document.getElementById('resetFilters').addEventListener('click', resetAllFilters);

        // Fetch Google Sheet data automatically on load
        async function fetchLiveSheetData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const csvText = await response.text();
                
                // Parse CSV text using SheetJS
                const workbook = XLSX.read(csvText, { type: 'string' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                rawData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                if (rawData.length > 0) {
                    columns = Object.keys(rawData[0]);
                    
                    // Hide loader, reveal Dashboard
                    document.getElementById('loadingStatus').classList.add('hidden');
                    document.getElementById('filterContainer').classList.remove('hidden');
                    document.getElementById('tableContainer').classList.remove('hidden');
                    
                    buildFilters();
                    updateDashboard();
                } else {
                    document.getElementById('loadingStatus').textContent = "Sheet is empty or missing headers.";
                }
            } catch (error) {
                console.error("Failed to fetch data:", error);
                document.getElementById('loadingStatus').innerHTML = `<span class="text-red-500 font-semibold">Error loading Google Sheet data. Please check your URL publication settings.</span>`;
            }
        }

        // Build dynamic filter dropdowns
        function buildFilters() {
            const grid = document.getElementById('filtersGrid');
            grid.innerHTML = ''; 

            columns.forEach(col => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col';
                wrapper.innerHTML = `
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">${col}</label>
                    <select data-column="${col}" class="filter-select w-full p-2 border border-gray-300 rounded-md bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
                        <option value="">All</option>
                    </select>
                `;
                grid.appendChild(wrapper);
            });

            document.querySelectorAll('.filter-select').forEach(select => {
                select.addEventListener('change', function() {
                    const col = this.getAttribute('data-column');
                    if (this.value === "") {
                        delete activeFilters[col];
                    } else {
                        activeFilters[col] = this.value;
                    }
                    updateDashboard();
                });
            });
        }

        // Handle cascading filter cross-logic and refresh table view
        function updateDashboard() {
            const filteredData = rawData.filter(row => {
                for (let col in activeFilters) {
                    if (String(row[col]).trim() !== activeFilters[col]) {
                        return false;
                    }
                }
                return true;
            });

            document.querySelectorAll('.filter-select').forEach(select => {
                const col = select.getAttribute('data-column');
                const currentValue = select.value;

                // Evaluate options strictly matching cross-filters
                const dataFilteredByOthers = rawData.filter(row => {
                    for (let otherCol in activeFilters) {
                        if (otherCol === col) continue; 
                        if (String(row[otherCol]).trim() !== activeFilters[otherCol]) {
                            return false;
                        }
                    }
                    return true;
                });

                const uniqueValues = [...new Set(dataFilteredByOthers.map(row => String(row[col]).trim()))]
                                      .filter(val => val !== "")
                                      .sort();

                select.innerHTML = '<option value="">All</option>';
                uniqueValues.forEach(val => {
                    const option = document.createElement('option');
                    option.value = val;
                    option.textContent = val;
                    if (val === currentValue) option.selected = true;
                    select.appendChild(option);
                });
            });

            renderTable(filteredData);
        }

        // Output data table HTML
        function renderTable(data) {
            const headerRow = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');
            document.getElementById('recordCount').textContent = `Showing ${data.length} of ${rawData.length} rows`;

            headerRow.innerHTML = '<tr>' + columns.map(col => `
                <th class="px-6 py-3 text-xs font-semibold uppercase tracking-wider text-gray-500 bg-gray-50">${col}</th>
            `).join('') + '</tr>';

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="${columns.length}" class="px-6 py-10 text-center text-gray-400">No matching records found.</td></tr>`;
                return;
            }

            tableBody.innerHTML = data.map(row => {
                return `<tr class="hover:bg-gray-50 transition">` + columns.map(col => `
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600 border-b border-gray-100">${row[col] ?? ""}</td>
                `).join('') + `</tr>`;
            }).join('');
        }

        function resetAllFilters() {
            activeFilters = {};
            document.querySelectorAll('.filter-select').forEach(select => select.value = "");
            updateDashboard();
        }

        // Initialize on mount
        fetchLiveSheetData();
    </script>
</body>
</html>
