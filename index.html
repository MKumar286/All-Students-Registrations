<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration Dashboard</title>

<!-- Papa Parse -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f7fa;
    alignment:center
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.search-container{
    margin-bottom:15px;
}

#searchInput{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

.stats{
    margin-bottom:15px;
    font-weight:bold;
    color:#444;
}

.table-container{
    width:100%;
    overflow:auto;
    max-height:85vh;
    border:1px solid #ddd;
}

table{
    border-collapse:collapse;
    table-layout:auto;
    width:max-content;
    min-width:100%;
    font-size:13px;
}

th,
td{
    border:1px solid #dadce0;
    padding:6px 10px;
    text-align:center;
    vertical-align:middle;

    /* Google Sheet style */
    white-space:nowrap;
}

th{
    position:sticky;
    top:0;
    background:#f8f9fa;
    color:#202124;
    font-weight:600;
    z-index:100;
}

tbody tr:hover{
    background:#f8fbff;
}

.loading{
    text-align:center;
    padding:20px;
    font-weight:bold;
}

</style>
</head>
<body>

<h1>Student Registration Dashboard</h1>

<div class="search-container">
    <input
        type="text"
        id="searchInput"
        placeholder="Search Student, Roll No, Company, Branch..."
    >
</div>

<div class="stats">
    Total Records:
    <span id="recordCount">0</span>
</div>

<div class="table-container">
    <table id="studentTable">
        <thead></thead>
        <tbody>
            <tr>
                <td class="loading">Loading data...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>

/* ==============================
   GOOGLE SHEET CSV URL
============================== */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSwSxs2JtEUGewXFCvir7vQJMjsIdS-ODqzBeAQTi_4Wmp73pDTPh27f7qTedZpu_CTmMiBLMLf5lzm/pub?gid=837128863&single=true&output=csv";

/* ==============================
   GLOBAL DATA
============================== */

let sheetData = [];

/* ==============================
   CLEAN TEXT
============================== */

function cleanText(value){

    return String(value || "")
        .replace(/[\r\n\t]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

/* ==============================
   LOAD DATA
============================== */

function loadData(){

    Papa.parse(CSV_URL, {

        download: true,
        header: true,
        skipEmptyLines: true,

        complete: function(results){

            sheetData = results.data.map(row => {

                let cleanedRow = {};

                Object.keys(row).forEach(key => {

                    const cleanKey = cleanText(key);

                    cleanedRow[cleanKey] =
                        cleanText(row[key]);

                });

                return cleanedRow;
            });

            document.getElementById("recordCount")
                .innerText = sheetData.length;

            renderTable(sheetData);
        },

        error: function(error){

            console.error(error);

            document.querySelector("#studentTable tbody")
                .innerHTML =
                `<tr>
                    <td>Error loading data.</td>
                </tr>`;
        }
        
        
    });
}

/* ==============================
   RENDER TABLE
============================== */

function renderTable(data){

    if(!data.length) return;

    const headers = Object.keys(data[0]);

    document.querySelector("#studentTable thead").innerHTML =
        "<tr>" +
        headers.map(h => `<th>${h}</th>`).join("") +
        "</tr>";

    document.querySelector("#studentTable tbody").innerHTML =
        data.map(row =>
            "<tr>" +
            headers.map(h =>
                `<td>${row[h] || ""}</td>`
            ).join("") +
            "</tr>"
        ).join("");
}

/* ==============================
   SEARCH
============================== */

document.getElementById("searchInput")
.addEventListener("keyup", function(){

    const keyword =
        this.value.toLowerCase();

    const filteredData =
        sheetData.filter(row =>

            Object.values(row)
            .join(" ")
            .toLowerCase()
            .includes(keyword)

        );

    renderTable(filteredData);
});

/* ==============================
   INITIAL LOAD
============================== */

loadData();

/* ==============================
   AUTO REFRESH EVERY 30 SECONDS
============================== */

setInterval(loadData, 30000);

</script>

</body>
</html>
